version: '3.8'

services:
  # 1. Database: PostgreSQL
  db:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: iwings_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=iwings
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - iwings_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d iwings" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 2. Backend: FastAPI Control Plane
  control-plane:
    build:
      context: ./control-plane
      dockerfile: Dockerfile
    container_name: iwings_backend
    ports:
      - "8000:8000"
    volumes:
      - ./control-plane:/app
      - /app/__pycache__
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/iwings
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - iwings_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 3. Frontend: Next.js Dashboard
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: iwings_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
    depends_on:
      control-plane:
        condition: service_healthy
    networks:
      - iwings_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})\"" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  iwings_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
